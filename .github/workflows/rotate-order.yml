name: Rotate Order

on:
  schedule:
    - cron: '30 2 * * *'   # 2:30 AM UTC daily, after the song update job
  workflow_dispatch:        # allow manual trigger

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No-op until every song in songs/order.json has had its day; then the
      # order is reshuffled and its start date moves to today.
      - name: Rotate the order if the cycle finished
        run: python scripts/generate_order.py --rotate

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heardle/songs/order.json
          git diff --cached --quiet || git commit -m "chore: start a new song rotation [automated]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
