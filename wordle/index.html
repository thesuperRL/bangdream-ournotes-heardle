<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>BanG Dream! Our Notes Character Wordle</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
<div class="site-header">
    <nav class="navbar navbar-expand navbar-dark bg-black">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item navbig">
                        <a href="#" class="btn me-2 mb-2 popup-link"
                           data-bs-toggle="modal"
                           data-bs-target="#customModal"
                           data-popup-title="About"
                           data-popup-content='<p class="modal-inner"> A character guessing game for BanG Dream! Our Notes, covering all 25 members of MyGO!!!!!, Ave Mujica, Mugendai MewType, millsage, and Ikka Dumb Rock!. <br><br> Character details come from the BanG Dream! Wiki. Inspired by <a href="https://www.amiya.io/wordle" target="_blank" rel="noopener">amiya.io/wordle</a>. Made by thesuperRL. <br><br> Have questions or bugs? DM thesuperRL on Discord. </p>'>
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white"
                                 class="bi bi-info-circle" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
                            </svg>
                        </a>
                    </li>
                    <li class="nav-item navbig">
                        <a class="nav-link text-center nav-title" href="#">BANG DREAM! OUR NOTES WORDLE</a>
                    </li>
                    <li class="nav-item navbig">
                        <a href="#" class="btn me-2 mb-2 popup-link"
                           data-bs-toggle="modal"
                           data-bs-target="#customModal"
                           data-popup-title="How to Play?"
                           data-popup-content='<p class="modal-inner"> Guess the BanG Dream! Our Notes character of the day. You have 5 tries. <br><br> Every guess fills a row with that character&apos;s band, position, school year, height and school. The colours tell you how close you were: <br><br> <span class="hint-swatch">Blue</span> means that detail matches the answer exactly. <br><br> <span class="hint-swatch-dim">Purple</span> on the position column means you share at least one instrument but not the whole set, for example a guess that only plays guitar against an answer that sings and plays guitar. <br><br> Year and height are always <span class="hint-swatch-dim">dim pink</span> and carry an arrow instead: &#8593; means the answer is higher than your guess, &#8595; means it is lower. No arrow means you matched it. <br><br> Grey means no match at all. <br><br> Ave Mujica members can be found under either their real name or their stage name. <br><br> Answer in as few tries as possible and share your score! </p>'>
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white"
                                 class="bi bi-question-circle" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                <path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286m1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94"/>
                            </svg>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <hr class="divider">
</div>

<main class="container nopad">
    <div class="container justify-content-center text-center">
        <table class="guess-table" id="guess-table">
            <thead>
            <tr>
                <th><span class="visually-hidden">Icon</span></th>
                <th>Name</th>
                <th>Band</th>
                <th>Position</th>
                <th>Year</th>
                <th>Height</th>
                <th>School</th>
            </tr>
            </thead>
            <!-- Rows are rendered by initGuessTable() so the count lives in one place. -->
            <tbody id="guess-rows"></tbody>
        </table>
    </div>
</main>

<footer class="text-center">
    <hr class="divider">
    <div class="text-center footerdiv">
        <div class="search-container">
            <!-- Filled by renderBoard() so the guess limit lives only in MAX_GUESSES. -->
            <p id="guesses-left"></p>
            <input type="text" id="search-input" placeholder="Search for a character...">
            <div id="suggestions"></div>
            <div class="container justify-content-center text-center">
                <button id="submit-btn" disabled>Submit</button>
            </div>
            <div class="container justify-content-center text-center">
                <label for="lang-select" id="lang-label">Character names:</label>
                <select id="lang-select">
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
            <div class="container justify-content-center text-center">
                <a id="credits-link" href="../">All games</a>
                <a id="credits-link-sources" href="credits.html">Data &amp; image sources</a>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap Modal -->
<div class="modal fade" id="customModal" tabindex="-1" aria-labelledby="customModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content custom-modal-content">
            <div class="modal-header custom-modal-header">
                <h5 class="modal-title text-center w-100" id="customModalLabel">Modal Title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body custom-modal-body" id="customModalBody">
                Modal content will appear here...
            </div>
        </div>
    </div>
</div>

<div id="endOverlay"></div>
<div id="endPopup"></div>

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
